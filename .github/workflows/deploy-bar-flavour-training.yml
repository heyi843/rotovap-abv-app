name: Deploy BAR FLAVOUR Training App

on:
  push:
    branches:
      - main
    paths:
      - "bar-flavour-app/**"
      - ".github/workflows/deploy-bar-flavour-training.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp -R bar-flavour-app public/bar-flavour-app
          cp -R rotovap-abv-app public/rotovap-abv-app
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <meta http-equiv="refresh" content="0; url=./bar-flavour-app/" />
              <title>BAR FLAVOUR Training App</title>
            </head>
            <body>
              <p><a href="./bar-flavour-app/">Open BAR FLAVOUR Training App</a></p>
            </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
