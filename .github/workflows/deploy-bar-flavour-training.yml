name: Deploy BAR FLAVOUR Training App

on:
  push:
    branches:
      - main
    paths:
      - "bar-flavour-app/**"
      - ".github/workflows/deploy-bar-flavour-training.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp -R rotovap-abv-app/. public/
          cp -R bar-flavour-app public/bar-flavour-app

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
