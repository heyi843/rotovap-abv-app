name: Deploy Rotovap ABV App

on:
  push:
    branches:
      - main
    paths:
      - "rotovap-abv-app/**"
      - ".github/workflows/deploy-rotovap-abv.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: rotovap-abv-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
